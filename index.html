<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f4f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
<title>Flugradar</title>
<meta name="referrer" content="strict-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://server.arcgisonline.com https://api.tiles.openaip.net; connect-src 'self' https://api.adsb.lol https://api.airplanes.live https://opensky-network.org https://globe.adsb.lol https://api.adsbdb.com https://aviationweather.gov https://nominatim.openstreetmap.org https://*.workers.dev; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<style>
/* Schriften liegen im Repo (vendor/fonts), damit beim Laden keine Anfrage an Google geht. */
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url(vendor/fonts/barlow-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-display:swap;src:url(vendor/fonts/barlow-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-display:swap;src:url(vendor/fonts/barlow-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-display:swap;src:url(vendor/fonts/barlow-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url(vendor/fonts/barlow-condensed-latin-700-normal.woff2) format("woff2")}
/* Layout wie Zugradar und Schiffsradar: Karte füllt den Schirm; oben Ort + Filterchips, unten Reiter und ein Blatt. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --line:#d3d9e0; --fg:#141c24; --muted:#5a6774;
  --linie:#1f64a8; --ga:#1f8a4c; --heli:#b86f06; --mil:#5d6d2b; --sonst:#0a7e8c;
  --nav:#8e3a8a; --apt:#34556e; --vfr:#1f8a4c; --mvfr:#1f64a8; --ifr:#c8202f; --lifr:#a0309a; --aip:#a35a00;
  --late:#c8202f; --ontime:#1f8a4c; --focus:#0b6bcb; --emg:#d0102a;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --sign:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#14171c; --surface:#1d2229; --line:#333b45; --fg:#e8edf2; --muted:#98a4b0;
  --linie:#78b4ee; --ga:#55c486; --heli:#e5a84a; --mil:#a9bf5c; --sonst:#4cc3d1;
  --nav:#d58ad0; --apt:#9fbbd0; --vfr:#55c486; --mvfr:#78b4ee; --ifr:#f0616c; --lifr:#d98ad6; --aip:#e5a84a;
  --late:#f0616c; --ontime:#55c486; --focus:#7db8f5; --emg:#ff5a6a; color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.35 var(--ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--focus)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

#app{position:fixed;inset:0;display:flex;flex-direction:column}
#map{flex:1;min-height:0;background:var(--bg);z-index:0}

.top{position:absolute;z-index:500;left:0;right:0;top:0;display:flex;flex-direction:column;gap:8px;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
.top>*{pointer-events:auto}
.bar{display:flex;gap:8px}
.station{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;text-align:left;background:var(--surface);
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.station small{color:var(--muted);font-size:12px;letter-spacing:.04em;text-transform:uppercase;flex:none}
.station b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{flex:none;width:44px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.12);display:grid;place-items:center}
.icon svg{width:20px;height:20px;stroke:var(--fg);fill:none;stroke-width:2}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;
  padding:6px 11px;font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.1);white-space:nowrap}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);opacity:.35}
.chip[aria-pressed="true"]{border-color:var(--c)}
.chip[aria-pressed="true"] i{opacity:1}
.chip[aria-pressed="false"]{color:var(--muted)}
.chip[aria-expanded="true"]{border-color:var(--fg)}
.menu{max-height:60dvh;overflow-y:auto;align-self:flex-start;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,.22);padding:6px 4px;min-width:230px}
.menu h3{margin:4px 10px 2px;font:600 12px/1.2 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.menu label{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer}
.menu i.ring{background:none!important;border:2px solid var(--muted)}
.menu label i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.menu input{width:18px;height:18px;margin:0}
.menu .all{display:flex;gap:12px;padding:4px 10px 6px}
.menu .all button{background:none;border:0;padding:4px 0;color:var(--focus);font-weight:500}
.lineq{flex:none;width:150px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 11px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.status{align-self:flex-start;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:var(--muted)}
.status.err{color:var(--late);border-color:var(--late)}
.track{align-self:flex-start;max-width:100%;display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.12);overflow:hidden}
.tbtn{min-width:0;background:none;border:0;padding:9px 4px 9px 14px;font:600 14px/1.2 var(--ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.tbtn::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:8px}
.tstop{flex:none;background:none;border:0;padding:0 14px;font-size:22px;line-height:1;color:var(--muted)}
.news{align-self:flex-start;max-width:100%;display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--focus);border-radius:999px;box-shadow:0 1px 4px rgba(0,0,0,.12);font-size:13px;overflow:hidden}
.news button{background:none;border:0;padding:6px 10px;color:var(--fg);text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.news b{color:var(--focus);font-weight:600}
.news .nx{color:var(--muted);padding:6px 12px 6px 6px}
.newsbox h3{font:600 15px/1.2 var(--ui);margin:14px 0 4px}
.newsbox h3:first-child{margin-top:0}
.newsbox ul{margin:0;padding-left:18px}.newsbox li{margin:3px 0}
.newslink{background:none;border:0;padding:6px 0;color:var(--focus);text-decoration:underline;font-weight:500}
.foot{display:flex;flex-wrap:wrap;gap:4px 18px;margin-top:6px}
.about h3{font:600 15px/1.2 var(--ui);margin:18px 0 4px}.about h3:first-child{margin-top:0}
.about p{margin:4px 0}.about ul{margin:4px 0;padding-left:18px}.about li{margin:3px 0}

/* Flugzeuge auf der Karte: Silhouette in Flugrichtung, Kennung und Höhe ab Zoom 8 */
.pm{position:absolute;left:0;top:0}
.pm::after{content:"";position:absolute;left:-16px;top:-16px;width:32px;height:32px}
.pm svg{position:absolute;overflow:visible;transform-origin:50% 50%}
.pm path{fill:var(--c);stroke:var(--surface);stroke-width:1.5;stroke-linejoin:round}
.pm.gnd svg{opacity:.55}
.pm.old path{fill:var(--surface);stroke:var(--c);stroke-dasharray:2.5 2}
.pm b{position:absolute;left:14px;top:-10px;display:flex;align-items:center;gap:4px;font:700 12px/1 var(--sign);letter-spacing:.02em;padding:3px 5px;border-radius:4px;color:#fff;background:var(--c);
  border:1.5px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.3);white-space:nowrap}
.pm b em{font-style:normal;font-weight:600;font-size:11px;background:var(--surface);color:var(--fg);border-radius:3px;padding:1px 3px}
.pm.old b{background:var(--surface);color:var(--c);border:1.5px dashed var(--c)}
.pm.sel::before{content:"";position:absolute;left:-19px;top:-19px;width:38px;height:38px;border-radius:50%;border:3px solid var(--focus);box-sizing:border-box}
.pm.sel b{font-size:14px;z-index:2}
.pm.emg::before{content:"";position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;border:3px solid var(--emg);box-sizing:border-box;animation:pulse 1.2s ease-in-out infinite}
.pm.emg b{background:var(--emg)}
@keyframes pulse{50%{transform:scale(1.25);opacity:.4}}
@media (prefers-color-scheme:dark){.pm b{color:#101416}}
.c-linie{--c:var(--linie)} .c-ga{--c:var(--ga)} .c-heli{--c:var(--heli)} .c-mil{--c:var(--mil)} .c-sonst{--c:var(--sonst)}
.c-nav{--c:var(--nav)} .c-apt{--c:var(--apt)} .c-wx{--c:var(--vfr)} .c-aip{--c:var(--aip)} .c-emg{--c:var(--emg)}
.c-VFR{--c:var(--vfr)} .c-MVFR{--c:var(--mvfr)} .c-IFR{--c:var(--ifr)} .c-LIFR{--c:var(--lifr)}
/* Navigation: Funkfeuer und Flugplätze in ICAO-ähnlichen Zeichen */
.nv{position:absolute;left:0;top:0;color:var(--c)}
.nv svg{position:absolute;left:-10px;top:-10px;width:20px;height:20px;overflow:visible}
.nv svg *{fill:none;stroke:var(--c);stroke-width:1.6}
.nv svg .f,.nv svg .f *{fill:var(--c);stroke:none}
.nv svg .s{fill:var(--surface)}
.nv svg text{fill:var(--c);stroke:none;font:700 10px/1 var(--sign)}
.nv i{position:absolute;left:11px;top:-6px;font:700 11px/1 var(--sign);font-style:normal;letter-spacing:.03em;white-space:nowrap;color:var(--c);
  text-shadow:0 0 2px var(--surface),0 0 2px var(--surface),0 0 3px var(--surface)}
.wxm{position:absolute;left:0;top:0}
.wxm span{position:absolute;left:5px;top:-15px;width:11px;height:11px;border-radius:50%;background:var(--c);border:2px solid var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.rlab{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.18);
  font:600 13px/1.2 var(--sign);padding:2px 7px;white-space:nowrap}
.rlab.dest{border-color:var(--c);color:var(--c)}
.rlab:before{display:none}
.leaflet-container{font-family:var(--ui);background:var(--bg)}
.leaflet-control-attribution{font-size:10px;background:color-mix(in srgb,var(--surface) 80%,transparent)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.me{width:14px;height:14px;border-radius:50%;background:var(--focus);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--focus);transform:translate(-50%,-50%);position:absolute}
.pin{position:absolute;width:18px;height:18px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--fg);background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pin::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--fg)}

/* Blatt */
.sheet{position:relative;z-index:600;background:var(--surface);border-top:1px solid var(--line);max-height:62dvh;display:flex;flex-direction:column;
  box-shadow:0 -6px 18px rgba(0,0,0,.14);padding:0 max(14px,env(safe-area-inset-right,0px)) 0 max(14px,env(safe-area-inset-left,0px))}
.sheet header{display:flex;align-items:center;gap:10px;padding:12px 0 8px}
.sheet header h2{flex:1;min-width:0;margin:0;font:600 17px/1.2 var(--ui);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet header h2 span{color:var(--muted);font-weight:400}
.x{background:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px;color:var(--muted)}
.body{overflow-y:auto;min-height:0;padding-bottom:12px;display:flex;flex-direction:column;gap:10px}
.badge{flex:none;font:700 15px/1 var(--sign);letter-spacing:.02em;padding:5px 7px;border-radius:5px;background:var(--c);color:#fff;white-space:nowrap;max-width:62vw;overflow:hidden;text-overflow:ellipsis}
@media (prefers-color-scheme:dark){.badge{color:#101416}}
.nowrow{display:flex;gap:12px;align-items:center;justify-content:space-between}
.now{font-weight:500;min-width:0;flex:1}
.now small{display:block;color:var(--muted);font-weight:400}
.kpis{flex:none;display:flex;gap:14px}
.speed{flex:none;text-align:right;font:700 28px/1 var(--sign);letter-spacing:.01em;white-space:nowrap}
.speed small{display:block;margin-top:3px;font:500 11px/1.2 var(--ui);color:var(--muted);letter-spacing:0}
.late{color:var(--late);font-weight:600} .ok{color:var(--ontime);font-weight:600}
.route{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.route .ap{flex:1;min-width:0}
.route .ap b{display:block;font:700 22px/1 var(--sign)}
.route .ap small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.route .ap.r{text-align:right}
.route .arrow{flex:none;color:var(--muted);font-size:20px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:500;text-decoration:none;color:inherit}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.btn.pri{background:var(--fg);color:var(--surface);border-color:var(--fg)}
.btn:disabled{opacity:.6}
.field{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.favbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.favbox p{flex-basis:100%;margin:0;color:var(--muted);font-size:13px}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:5px 14px;margin:0}
.facts dt{color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.wx{display:flex;flex-direction:column;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.wx .h{display:flex;align-items:center;gap:8px}
.wx .h b{flex:1;min-width:0;font-weight:600}
.wx .cat{flex:none;font:700 13px/1 var(--sign);padding:4px 6px;border-radius:4px;background:var(--c);color:#fff}
@media (prefers-color-scheme:dark){.wx .cat{color:#101416}}
.wx code{font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);overflow-wrap:anywhere}

.rows{list-style:none;margin:0;padding:0}
.rows li{border-top:1px solid var(--line)}
.row{width:100%;display:grid;grid-template-columns:58px auto minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;background:none;border:0;padding:9px 0}
.row .t{font:600 15px/1.1 var(--ui)}
.row .t small{display:block;font-weight:600;font-size:12px;color:var(--muted);white-space:nowrap}
.row .t small.now{color:var(--ontime)}
.row .d{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .d small{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis}
.row .g{color:var(--muted);font-size:13px;white-space:nowrap}
.sub{margin:2px 0 -4px;font:600 12px/1 var(--ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hint{color:var(--muted);margin:0}
.check{display:flex;gap:8px;align-items:center}
.fav{border-top:1px solid var(--line);padding:10px 0;display:flex;align-items:center;gap:8px}
.fav .open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.fav .open p{flex:1;min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav .open p small{display:block;color:var(--muted)}

nav{position:relative;z-index:600;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;padding:11px 4px 10px;font-weight:500;color:var(--muted);border-top:3px solid transparent}
nav button[aria-current="true"]{color:var(--fg);border-top-color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <div class="bar">
      <button class="station" id="placeBtn" type="button"><small>Mein Ort</small><b id="placeName">wählen</b></button>
      <button class="icon" id="locBtn" type="button" aria-label="Karte auf meinen Standort zentrieren">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>
      </button>
    </div>
    <div class="chips" id="chips">
      <button class="chip" id="typeBtn" type="button" aria-haspopup="true" aria-expanded="false"><span id="typeTxt">Typen</span> ▾</button>
      <button class="chip c-nav" id="navChip" type="button" aria-pressed="true"><i></i>Navigation</button>
      <button class="chip c-wx" id="wxChip" type="button" aria-pressed="true"><i></i>Wetter</button>
      <button class="chip c-aip" id="aipChip" type="button" aria-pressed="false"><i></i>Luftraum</button>
      <input class="lineq" id="planeQ" type="search" placeholder="Flug, Kennz., Typ" enterkeyhint="search" autocomplete="off" aria-label="Nach Flug, Kennzeichen, Typ oder Hex-Code filtern">
    </div>
    <div class="menu" id="menu" hidden></div>
    <div class="status num" id="status" role="status">Lade Flugzeuge …</div>
    <div class="news" id="hint" hidden><button id="hintOpen" type="button"><b>Hinweis: </b>Flugzeuge erscheinen ab Zoom 6 und werden nur für den sichtbaren Ausschnitt geladen.</button><button class="nx" id="hintX" type="button" aria-label="Hinweis schließen">×</button></div>
    <div class="news" id="news" hidden><button id="newsOpen" type="button"></button><button class="nx" id="newsX" type="button" aria-label="Hinweis schließen">×</button></div>
    <div class="track" id="track" hidden><button class="tbtn" id="trackOpen" type="button" aria-label="Verfolgtes Flugzeug anzeigen"></button><button class="tstop" id="trackStop" type="button" aria-label="Verfolgung beenden">×</button></div>
  </div>

  <div id="map"></div>

  <section class="sheet" id="sheet" hidden>
    <header><span class="badge" id="shBadge" hidden></span><h2 id="shTitle"></h2><button class="x" id="shClose" type="button">Schließen</button></header>
    <div class="body" id="shBody"></div>
  </section>

  <nav>
    <button type="button" data-tab="map" aria-current="true">Karte</button>
    <button type="button" data-tab="pass">Mein Ort</button>
    <button type="button" data-tab="fav">Meine Flüge</button>
  </nav>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script>
/* ===== PURE ===== */
const CATS={linie:'Verkehrsflugzeuge',ga:'Allgemeine Luftfahrt',heli:'Hubschrauber',mil:'Militär',sonst:'Segelflug · Sonstige'};
const CAT_ORDER=['linie','ga','heli','mil','sonst'];
const KN=0.514444,FT=0.3048,NM=1852,R_EARTH=6371008.8,RAD=Math.PI/180;
const STALE=60;        // ab 60 s ohne neue Position gestrichelt
const EXTRAP_MAX=60;   // Position höchstens 60 s geradeaus fortschreiben
const DROP=300;        // nach 5 min ohne Position aus der Liste (verfolgte und gemerkte bleiben)
const AHEAD=300;       // Kurslinie: 5 Minuten voraus
/* ADS-B-Emitterkategorie (DO-260B) */

  const orig=L.polyline([],{...o,color:grey,weight:2,opacity:.5,dashArray:'2 8'});
  const trail=L.polyline([],{...o,color:grey,weight:4,opacity:.6,lineCap:'round'});
  const dest=L.polyline([],{...o,color:c,weight:2.5,opacity:.85,dashArray:'8 8'});
  const casing=L.polyline([],{...o,color:fill,weight:10,opacity:.9,lineCap:'round'});
  const ahead=L.polyline([],{...o,color:c,weight:6,lineCap:'round'});
  const group=L.layerGroup([orig,trail,dest,casing,ahead]).addTo(map);
  route={group,orig,trail,dest,casing,ahead,cat:p.cat,labels:new Map()};
}
function setLabel(key,ll,txt,dest){
  let tt=route.labels.get(key);
  if(!ll){if(tt){route.group.removeLayer(tt);route.labels.delete(key);}return;}
  if(!tt){
    tt=L.tooltip({permanent:true,direction:'auto',offset:[10,0],className:'rlab'+(dest?' dest':'')+' c-'+route.cat,interactive:false}).setLatLng(ll).setContent(txt);
    route.group.addLayer(tt);route.labels.set(key,tt);tt._txt=txt;
  }else{tt.setLatLng(ll);if(tt._txt!==txt){tt.setContent(txt);tt._txt=txt;}}
}
function apLabel(a){return a.city||a.name||a.icao;}
function apCode(a){return a.iata||a.icao||'';}
/* Ankunft grob schätzen: Großkreis zum Ziel mit aktueller Geschwindigkeit, dazu etwas für Anflug und Landung */
function etaOf(p,pos,d){
  if(p.gnd||!p.gs||p.gs<60)return null;
  const rem=dist(pos,[d.lat,d.lon]),v=p.gs*KN;
  return Date.now()+(rem*1.05/v+(rem>80000?480:120))*1000;
}
function paintRoute(){
  const sel=state.sel;if(!route||!sel)return;
  const p=planeBy(sel.h);if(!p)return;
  const now=nowSec(),pos=planePos(p,now),pts=[],tr=p.tr||[];
  for(let i=0;i+3<tr.length;i+=4)if(tr[i+2]<=p.ts+1)pts.push([tr[i],tr[i+1]]);
  pts.push([p.lat,p.lon],pos.ll);
  route.trail.setLatLngs(pts.length>2?pts:[]);
  let ahead=[];
  if(!p.gnd&&p.trk!=null&&p.gs>30)ahead=[pos.ll,project(pos.ll,p.trk,p.gs*KN*AHEAD)];
  route.ahead.setLatLngs(ahead);route.casing.setLatLngs(ahead);
  setLabel('ahead',ahead.length?ahead[1]:null,'in 5 min');
  const rt=sel.rt&&sel.rt.ok?sel.rt:null;
  if(rt&&rt.d&&!p.gnd&&dist(pos.ll,[rt.d.lat,rt.d.lon])>3000){
    const dd=[rt.d.lat,rt.d.lon],line=gcPoints(pos.ll,dd);
    route.dest.setStyle({dashArray:rt.plausible===false?'3 9':'8 8',opacity:rt.plausible===false?.5:.85});
    route.dest.setLatLngs(line);
    const rem=dist(pos.ll,dd),eta=etaOf(p,pos.ll,rt.d);
    setLabel('dest',line[line.length-1],'Ziel '+apLabel(rt.d)+(apCode(rt.d)?' ('+apCode(rt.d)+')':'')+' · '+fmtKm(rem)+(eta?' · ca. '+hhmm(eta):''),true);
  }else{route.dest.setLatLngs([]);setLabel('dest',null);}
  if(rt&&rt.o&&pts.length&&dist(pts[0],[rt.o.lat,rt.o.lon])>3000){
    route.orig.setLatLngs(gcPoints([rt.o.lat,rt.o.lon],pts[0],24));
    setLabel('orig',[rt.o.lat,rt.o.lon],'Start '+apLabel(rt.o));
  }else{route.orig.setLatLngs([]);setLabel('orig',null);}
}
function showRoute(){
  const sel=state.sel,p=sel&&planeBy(sel.h);if(!p)return;
  const pos=planePos(p,nowSec()),pts=[pos.ll],tr=p.tr||[];
  for(let i=0;i+3<tr.length;i+=4)pts.push([tr[i],tr[i+1]]);
  const rt=sel.rt&&sel.rt.ok?sel.rt:null;
  if(rt&&rt.d)pts.push(...gcPoints(pos.ll,[rt.d.lat,rt.d.lon],16));
  if(rt&&rt.o)pts.push([rt.o.lat,rt.o.lon]);
  if(!rt&&p.trk!=null&&p.gs)pts.push(project(pos.ll,p.trk,p.gs*KN*AHEAD));

}

/* ---------- Routen (adsb.lol routeset, Rückfall adsbdb) und Flugzeugdaten (adsbdb) ---------- */
const routes=new Map();   // Rufzeichen -> {at, ok, o, d, plausible, airline}
const ROUTE_TTL=1800000,ROUTE_MISS=600000;
const apFrom=a=>a?{icao:a.icao||a.icao_code||'',iata:a.iata||a.iata_code||'',name:a.name||'',city:a.location||a.municipality||'',lat:+(a.lat??a.latitude),lon:+(a.lon??a.longitude),cc:a.countryiso2||a.country_iso_name||''}:null;
function routeFresh(cs){const r=routes.get(cs);return r&&Date.now()-r.at<(r.ok?ROUTE_TTL:ROUTE_MISS)?r:null;}
async function routeSet(planes){   // [{p,pos}]
  const want=planes.filter(x=>x.p.cs&&airlineCs(x.p.cs)&&!routeFresh(x.p.cs)).slice(0,100);
  if(!want.length)return 0;
  for(const x of want)routes.set(x.p.cs,{at:Date.now()-ROUTE_MISS+60000,ok:false,busy:true});
  try{
    const j=await getJSON('https://api.adsb.lol/api/0/routeset',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({planes:want.map(x=>({callsign:x.p.cs,lat:+x.pos[0].toFixed(3),lng:+x.pos[1].toFixed(3)}))}),timeout:20000});
    const by=new Map(want.map(x=>[x.p.cs,x.pos]));
    for(const r of Array.isArray(j)?j:[]){
      const aps=(r._airports||[]).map(apFrom).filter(a=>a&&isFinite(a.lat));
      const leg=pickLeg(aps,by.get(r.callsign));
      routes.set(r.callsign,leg?{at:Date.now(),ok:true,o:leg.o,d:leg.d,plausible:r.plausible==null?null:!!r.plausible,src:'adsb.lol'}:{at:Date.now(),ok:false});
    }
  }catch(e){throw e;}   // Platzhalter bleiben 60 s, damit ein Ausfall nicht zu Dauerabfragen führt
  return want.length;
}
async function routeOne(cs,pos){
  if(routeFresh(cs))return routes.get(cs);
  if(pos)try{await routeSet([{p:{cs},pos}]);}catch(e){}
  let r=routes.get(cs);
  if(r&&r.ok)return r;
  try{   // Rückfall: adsbdb
    const j=await getJSON('https://api.adsbdb.com/v0/callsign/'+encodeURIComponent(cs));
    const fr=j&&j.response&&j.response.flightroute;
    if(fr&&fr.origin&&fr.destination){r={at:Date.now(),ok:true,o:apFrom(fr.origin),d:apFrom(fr.destination),plausible:null,airline:fr.airline&&fr.airline.name,src:'adsbdb'};routes.set(cs,r);}
    else{r={at:Date.now(),ok:false};routes.set(cs,r);}
  }catch(e){}
  return routes.get(cs)||null;
}
async function loadRoute(sel){
  const p=planeBy(sel.h);if(!p||!p.cs)return;
  const r=await routeOne(p.cs,[p.lat,p.lon]);
  if(state.sel!==sel)return;
  sel.rt=r;paintRoute();renderPlaneSheet();
}
const infoCache=new Map();
async function loadInfo(sel){
  if(infoCache.has(sel.h)){sel.info=infoCache.get(sel.h);return;}
  try{
    const j=await getJSON('https://api.adsbdb.com/v0/aircraft/'+encodeURIComponent(sel.h));
    const a=j&&j.response&&j.response.aircraft;
    sel.info=a?{type:a.type,icao:a.icao_type,maker:a.manufacturer,reg:a.registration,owner:a.registered_owner,ownerCc:a.registered_owner_country_iso_name}:null;
    infoCache.set(sel.h,sel.info);
    if(state.sel===sel&&sel.showData)renderPlaneSheet();
  }catch(e){}
}

/* ---------- Meine Flüge ---------- */
function toggleFav(f){
  const i=state.favs.findIndex(x=>x.k===f.k&&x.id===f.id);
  if(i>=0)state.favs.splice(i,1);else state.favs.push(f);
  store.set('favs',state.favs);
}
let favLookAt=0,favBusy=false;
const favSeen=new Map();   // id -> Zeitpunkt der letzten erfolglosen Abfrage
async function lookupFavs(){
  if(favBusy||document.hidden||Date.now()-favLookAt<60000)return;
  const fi=favIndex(),have=new Set();
  for(const p of state.planes.values()){if(p.cs&&fi.cs.has(p.cs))have.add('cs:'+p.cs);if(fi.hex.has(p.h))have.add('hex:'+p.h);}
  const cs=state.favs.filter(f=>f.k==='cs'&&!have.has('cs:'+f.id)).map(f=>f.id).slice(0,20);
  const hex=state.favs.filter(f=>f.k==='hex'&&!have.has('hex:'+f.id)).map(f=>f.id).slice(0,20);
  if(!cs.length&&!hex.length)return;
  favBusy=true;favLookAt=Date.now();
  try{
    const got=[];
    if(hex.length)got.push(...await lookup('hex',hex));
    if(cs.length)got.push(...await lookup('callsign',cs));
    for(const p of got){state.planes.set(p.h,merge(p,planeBy(p.h)));}
    for(const id of cs.concat(hex))if(!got.some(p=>p.cs===id||p.h===id))favSeen.set(id,Date.now());
  }catch(e){}finally{favBusy=false;}
  for(const f of state.favs)if(f.k==='cs'&&!routeFresh(f.id))routeOne(f.id,null).then(()=>{if(state.sheet==='fav')renderFavs();});
  if(state.sheet==='fav')renderFavs();render();
}
function renderFavs(){

    body.appendChild(newsLink());return;
  }
  const now=nowSec(),ps=[...state.planes.values()];
  state.favs.forEach((f,i)=>{
    const p=f.k==='cs'?ps.find(x=>x.cs===f.id&&now-x.ts<DROP):ps.find(x=>x.h===f.id&&now-x.ts<DROP);
    if(p){f.cat=p.cat;if(f.k==='hex'&&p.r)f.n=p.r;}
    const box=el('div','fav'),open=el('button','open');open.type='button';
    const pp=el('p'),rt=f.k==='cs'?routeFresh(f.id):null;

    if(p){

      pp.append(p.gnd?'am Boden':(rtx||phase(p))+' · '+fmtAlt(p.alt));
      let info=(p.gnd?'':kmh(p)+' km/h · ')+'Position '+ago(pos.age);
      if(f.k==='hex'&&p.cs)info=p.cs+' · '+info;
      if(rt&&rt.ok&&!p.gnd){const eta=etaOf(p,pos.ll,rt.d);if(eta)info+=' · Ankunft ca. '+hhmm(eta);}
      else if(state.place){const d=dist(pos.ll,[state.place.lat,state.place.lon]);info+=' · '+fmtKm(d)+' von '+state.place.name;}
      pp.appendChild(el('small',null,info));
      open.onclick=()=>selectPlane(p.h,true);
    }else{
      pp.append(rtx||(f.k==='cs'?'Flug '+f.id:'Flugzeug '+f.n));
      pp.appendChild(el('small',null,favSeen.has(f.id)||Date.now()-favLookAt<60000?'gerade nicht in der Luft oder nicht empfangen':'wird gesucht …'));
      open.disabled=true;
    }
    open.append(el('span','badge c-'+(f.cat||'sonst'),(f.k==='hex'?'':'✈ ')+f.n),pp);
    const rm=el('button','x','Entfernen');rm.type='button';
    rm.onclick=()=>{state.favs.splice(i,1);store.set('favs',state.favs);renderFavs();render();};
    box.append(open,rm);body.appendChild(box);

  const nm=pl.icao?60:30;

function computePass(){

  for(const p of allPlanes()){
    if(!state.cats.has(p.cat)||!matches(p,state.query)||now-p.ts>DROP)continue;
    const pos=planePos(p,now),d=dist(pos.ll,pl);
    if(d>300000)continue;
    if(icao){
      const r=p.cs?routeFresh(p.cs):null,rt=r&&r.ok?r:null;
      if(!r&&airlineCs(p.cs)&&d<200000)want.push({p,pos:pos.ll});
      const toHere=!!rt&&rt.d&&rt.d.icao===icao,fromHere=!!rt&&rt.o&&rt.o.icao===icao;
      if(p.gnd){if(d<5000)dep.push({p,pos,d,kind:'gnd',rt});continue;}
      const descending=p.vr!=null&&p.vr<-200&&p.alt!=null&&p.alt<12000&&p.trk!=null&&angDiff(p.trk,bearing(pos.ll,pl))<35;
      if((toHere&&!fromHere)||(!rt&&d<50000&&descending)){

      if(fromHere&&d<250000){dep.push({p,pos,d,kind:'air',rt});continue;}
    }
    if(p.gnd)continue;
    if(d<10000){near.push({p,pos,d,el:elevAngle(p.alt,elev,d),brg:bearing(pl,pos.ll)});continue;}
    if(p.trk!=null&&p.gs>40&&d<150000){const a=approach(pl,pos.ll,p.trk,p.gs,1200);if(a.d<5000&&a.t>10)come.push({p,pos,d,a,eta:now+a.t});}

  near.sort((a,b)=>a.d-b.d);come.sort((a,b)=>a.eta-b.eta);

}

/* ---------- Wetter: METAR (aviationweather.gov, Rückfall Datei im Repo) ---------- */
const metars=new Map();   // ICAO -> {id, lat, lon, raw, t, cat, name, file}
let wxLive=true,wxFailAt=0,wxFileAt=0,wxBoxes=[];
const wxLayer=L.layerGroup().addTo(map);
function covered(b){return wxBoxes.some(x=>Date.now()-x.at<600000&&x.b[0]<=b[0]&&x.b[1]<=b[1]&&x.b[2]>=b[2]&&x.b[3]>=b[3]);}
async function loadMetars(b,force){
  if((!state.wx&&!force)||covered(b))return;
  if(wxLive||Date.now()-wxFailAt>600000){
    try{
      const q='bbox='+b.map(x=>x.toFixed(2)).join(',')+'&format=json';
      const url=CFG.proxy?CFG.proxy.replace(/\/+$/,'')+'/metar?'+q:'https://aviationweather.gov/api/data/metar?'+q;
      const j=await getJSON(url,{timeout:15000});
      for(const m of Array.isArray(j)?j:[]){
        if(!m.icaoId||!m.rawOb)continue;
        const t=typeof m.obsTime==='number'?m.obsTime:Date.parse(m.reportTime||m.obsTime)/1000;
        const o=metars.get(m.icaoId);if(o&&!o.file&&o.t>t)continue;
        metars.set(m.icaoId,{id:m.icaoId,lat:m.lat,lon:m.lon,raw:m.rawOb,t,cat:m.fltCat||'',name:m.name?String(m.name).split(',')[0]:''});
      }
      wxLive=true;wxBoxes.push({b:b.slice(),at:Date.now()});if(wxBoxes.length>20)wxBoxes.shift();
      return;
    }catch(e){wxLive=false;wxFailAt=Date.now();}
  }
  if(Date.now()-wxFileAt<600000)return;
  wxFileAt=Date.now();
  try{
    const j=await getJSON('data/metar.json?t='+Math.floor(Date.now()/600000));
    for(const[id,r]of Object.entries(j.m||{})){const o=metars.get(id);if(o&&!o.file&&o.t>=r[0])continue;metars.set(id,{id,t:r[0],lat:r[1],lon:r[2],raw:r[3],cat:r[4]||'',name:'',file:true});}
  }catch(e){}
}
async function paintWx(){
  wxLayer.clearLayers();
  const z=map.getZoom();if(!state.wx||z<7)return;
  const bb=map.getBounds().pad(.2),b=[bb.getSouth(),bb.getWest(),bb.getNorth(),bb.getEast()];
  await loadMetars(b);
  wxLayer.clearLayers();
  const vb=map.getBounds().pad(.1),now=nowSec();
  for(const m of metars.values()){
    if(!vb.contains([m.lat,m.lon])||now-m.t>3*3600)continue;
    const cat=m.cat||decodeMetar(m.raw).cat||'VFR';
    const mk=L.marker([m.lat,m.lon],{icon:L.divIcon({className:'',html:'<span class="wxm c-'+cat+'"><span></span></span>',iconSize:[0,0]}),pane:'wx',keyboard:false,title:m.id+' · '+(CATTXT[cat]||'')});
    mk.on('click',()=>{state.wxSel=m;openSheet('wx');});
    wxLayer.addLayer(mk);
  }
}

/* ---------- Suche ---------- */
async function findPlane(){
  const raw=state.queryRaw,q=state.query;if(!q)return;
  const hits=[...allPlanes()].filter(p=>matches(p,q)&&nowSec()-p.ts<DROP).sort((a,b)=>(a.gnd?1:0)-(b.gnd?1:0)||nameOf(a).localeCompare(nameOf(b)));
  if(hits.length===1){selectPlane(hits[0].h,true);return;}
  if(hits.length>1){state.found=hits.slice(0,40);setTab('map',true);openSheet('find');return;}
  note('Suche „'+raw+'“ weltweit …',false,60000);
  const U=raw.toUpperCase().replace(/\s+/g,''),tries=[];
  const cs=toCallsign(U);if(cs)tries.push(['callsign',cs]);
  if(/^[A-Z0-9]{3,8}$/.test(U))tries.push(['callsign',U]);
  if(/^[A-Z0-9]{1,3}-?[A-Z0-9]{2,5}$/.test(U))tries.push(['reg',U]);
  if(/^[0-9A-F]{6}$/.test(U))tries.push(['hex',U.toLowerCase()]);
  try{
    for(const[k,v]of tries){
      const l=await lookup(k,[v]);
      if(l.length){state.note=null;for(const p of l)state.planes.set(p.h,merge(p,planeBy(p.h)));
        if(l.length===1)selectPlane(l[0].h,true);else{state.found=l;setTab('map',true);openSheet('find');}return;}
    }
    note('„'+raw+'“ ist gerade nirgends in der Luft zu sehen (oder sendet nicht).',true,10000);
  }catch(e){note('Suche nicht möglich: '+e.message,true,8000);}
}
function renderFind(){
  $('shTitle').textContent=state.found.length+' Treffer für „'+state.queryRaw+'“';
  const body=$('shBody');body.replaceChildren();
  const ul=el('ul','rows'),now=nowSec();
  for(const p of state.found){
    const li=el('li'),b=el('button','row');b.type='button';b.style.gridTemplateColumns='auto minmax(0,1fr)';
    const d=el('span','d',p.desc||p.t||CATS[p.cat]);d.appendChild(el('small',null,(p.gnd?'am Boden':fmtAlt(p.alt)+' · '+kmh(p)+' km/h')+' · Position '+ago(now-p.ts)));
    b.append(el('span','badge c-'+p.cat,nameOf(p)),d);
    b.onclick=()=>selectPlane(p.h,true);li.appendChild(b);ul.appendChild(li);
  }
  body.appendChild(ul);
}

document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.tab);});
$('shClose').onclick=closeSheet;
$('placeBtn').onclick=()=>{setTab('pass',true);openSheet('place');};

/* ---------- Filter ---------- */
function paintChips(){
  const n=state.cats.size,k=CAT_ORDER.length;
  $('typeTxt').textContent=(n===k?'Alle Typen':n?n+' von '+k+' Typen':'Keine Typen')+(state.gnd?' + Boden':'');
  $('navChip').setAttribute('aria-pressed',String(state.nav));
  $('wxChip').setAttribute('aria-pressed',String(state.wx));
  $('aipChip').setAttribute('aria-pressed',String(state.aip&&!!aipKey()));
}
let menuOpen=false;
function closeMenu(){menuOpen=false;$('menu').hidden=true;$('typeBtn').setAttribute('aria-expanded','false');}
function renderMenu(){
  const box=$('menu');
  box.replaceChildren(el('h3',null,'Diese Flugzeuge zeigen'));
  const all=el('div','all'),a1=el('button',null,'Alle'),a2=el('button',null,'Keine');a1.type=a2.type='button';
  const save=()=>store.set('cats',[...state.cats]);
  const setAll=on=>{state.cats=new Set(on?CAT_ORDER:[]);save();paintChips();renderMenu();render();paintPass(true);};
  a1.onclick=()=>setAll(true);a2.onclick=()=>setAll(false);all.append(a1,a2);box.appendChild(all);
  for(const k of CAT_ORDER){
    const lab=el('label','c-'+k),cb=el('input'),dot=el('i');cb.type='checkbox';cb.checked=state.cats.has(k);
    cb.onchange=()=>{cb.checked?state.cats.add(k):state.cats.delete(k);save();paintChips();render();paintPass(true);};
    lab.append(cb,dot,el('span',null,CATS[k]));box.appendChild(lab);
  }
  const lab=el('label'),cb=el('input'),dot=el('i','ring');cb.type='checkbox';cb.checked=state.gnd;
  cb.onchange=()=>{state.gnd=cb.checked;store.set('gnd',state.gnd);paintChips();render();};
  lab.append(cb,dot,el('span',null,'Am Boden (rollend oder geparkt)'));
  box.append(el('h3',null,'Zusätzlich'),lab);
}
function toggleMenu(){
  if(menuOpen){closeMenu();return;}
  if(state.sheet)closeSheet();
  menuOpen=true;renderMenu();$('menu').hidden=false;$('typeBtn').setAttribute('aria-expanded','true');
}
document.addEventListener('click',e=>{if(menuOpen&&!e.composedPath().some(n=>n.id==='menu'||n.id==='typeBtn'))closeMenu();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
$('chips').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  if(c.id==='typeBtn')return toggleMenu();
  if(c.id==='navChip'){state.nav=!state.nav;store.set('nav',state.nav);paintNav();}
  if(c.id==='wxChip'){state.wx=!state.wx;store.set('wx',state.wx);paintWx();}
  if(c.id==='aipChip'){
    if(!aipKey()){setTab('map',true);openSheet('aip');return;}
    state.aip=!state.aip;store.set('aip',state.aip);applyAip();
  }
  paintChips();
});
$('aipChip').addEventListener('contextmenu',e=>{e.preventDefault();openSheet('aip');});
$('planeQ').addEventListener('input',e=>{state.queryRaw=e.target.value.trim();state.query=norm(e.target.value);render();paintPass(true);});
$('planeQ').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.target.blur();findPlane();}});

/* ---------- Standort ---------- */
function locate(cb){
  if(!navigator.geolocation){setStatus('Dieser Browser gibt keinen Standort frei.',true);return;}
  navigator.geolocation.getCurrentPosition(p=>cb([p.coords.latitude,p.coords.longitude]),
    ()=>setStatus('Standort nicht verfügbar. Freigabe im Browser prüfen (nur über https).',true),{enableHighAccuracy:true,timeout:10000});
}
$('locBtn').onclick=()=>locate(ll=>{
  if(meMarker)meMarker.setLatLng(ll);else meMarker=L.marker(ll,{icon:L.divIcon({className:'',html:'<span class="me"></span>',iconSize:[0,0]}),interactive:false,pane:'wx'}).addTo(map);
  if(state.sel)state.sel.follow=false;
  map.setView(ll,Math.max(map.getZoom(),10));
});

/* ---------- Takt ---------- */
let moveT=null;
/* Doppeltippen = eine Zoomstufe näher, um die Tippstelle (eigene Erkennung, weil iOS-Safari das sonst als Seitenzoom schluckt) */
{const c=map.getContainer();let last=null;
  c.style.touchAction='none';
  c.addEventListener('pointerup',e=>{
    if(e.pointerType==='mouse'||e.target.closest('.leaflet-control,.leaflet-popup'))return;
    const t=Date.now(),p=[e.clientX,e.clientY];
    if(last&&t-last.t<320&&Math.hypot(p[0]-last.p[0],p[1]-last.p[1])<30){
      last=null;e.preventDefault();
      const z=Math.min(map.getMaxZoom()||18,map.getZoom()+1);
      if(state.sel&&state.sel.follow)map.setZoom(z);else map.setZoomAround(map.mouseEventToContainerPoint(e),z);
    }else last={t,p};
  });
  map.on('dblclick',e=>{const z=Math.min(map.getMaxZoom()||18,map.getZoom()+1);if(state.sel&&state.sel.follow)map.setZoom(z);else map.setZoomAround(e.containerPoint,z);});}
/* Beim Folgen verschiebt render() selbst die Karte; dann nicht erneut rendern, sonst entsteht eine Schleife */
map.on('moveend',()=>{
  const c=map.getCenter();store.set('view',{c:[c.lat,c.lng],z:map.getZoom()});
  if(!(state.sel&&state.sel.follow))render();
  clearTimeout(moveT);moveT=setTimeout(()=>{loadPlanes();paintNav();paintWx();},600);
});
map.on('dragstart',()=>{if(state.sel&&state.sel.follow){state.sel.follow=false;const b=$('followBtn');if(b)b.setAttribute('aria-pressed','false');}});
setInterval(()=>{
  if(document.hidden)return;
  render();paintPass();
  if(Date.now()-lastLoad>=interval())loadPlanes(true);
  refreshSel();loadExtra();
  if(state.sheet==='fav')lookupFavs();
},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadPlanes(true);});
$('hintX').onclick=$('hintOpen').onclick=()=>{store.set('hint',1);$('hint').hidden=true;};
if(!store.get('hint',0))$('hint').hidden=false;
async function loadConfig(){
  try{const r=await fetch('config.json',{cache:'no-cache'});if(r.ok){const j=await r.json();if(typeof j.proxy==='string')CFG.proxy=j.proxy.trim();if(typeof j.openaipKey==='string')CFG.openaipKey=j.openaipKey.trim();}}catch(e){}
}
paintPlace();paintChips();
Promise.race([loadConfig(),new Promise(r=>setTimeout(r,1500))]).then(()=>{paintChips();applyAip();render();loadPlanes(true);paintNav();paintWx();loadNews();});
</script>
</body>
</html>
